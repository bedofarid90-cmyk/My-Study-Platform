<!DOCTYPE html>
<html lang="ar" dir="rtl">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <meta name="description" content="ذاكر - حل الأسئلة واختبر نفسك">
    <title>ذاكر - الاختبار</title>
    <link href="https://fonts.googleapis.com/css2?family=Aref+Ruqaa+Ink:wght@400;700&family=Cairo:wght@400;700;900&family=Plus+Jakarta+Sans:wght@300;400;500;600;700;800&family=Caveat:wght@600;700&display=swap" rel="stylesheet">
    <link rel="stylesheet" href="style.css">
</head>
<body>

    <div class="header">
        <div style="display: flex; align-items: center; gap: 15px;">
            <button class="btn btn-secondary" onclick="window.location.href='lecture.html'" style="margin: 0; padding: 8px 15px;" data-i18n="backToLecsBtn">🔙 رجوع للمحاضرة</button>
            <h1 class="logo" data-i18n="appName" style="font-size: 2rem;">ذاكر</h1>
        </div>
        
        <div class="header-controls">
            <div class="settings-group">
                <button class="icon-btn" onclick="toggleLanguage()" title="Language">🌐</button>
                <button class="icon-btn" onclick="toggleTheme()" title="Theme">🌙</button>
            </div>
            <div id="userProfile" class="user-profile-badge hidden">
                <img id="userImg" src="" alt="User">
                <span id="userName"></span>
            </div>
        </div>
    </div>

    <div id="quizScreen" class="screen active">
        
        <div style="display: flex; justify-content: space-between; align-items: center; margin-bottom: 20px; max-width: 850px; margin-left: auto; margin-right: auto;">
            <button class="btn btn-secondary" id="soundToggleBtn" onclick="toggleQuizSound()" style="margin: 0;">🔊 الصوت شغال</button>
            <button class="btn btn-danger" onclick="cancelExam()" style="margin: 0;" data-i18n="endExamBtn">✖️ إنهاء المذاكرة</button>
        </div>
        
        <div class="quiz-container">
            
            <h2 id="lectureTitleQuiz" style="color: var(--primary-color); border-bottom: 1px dashed var(--glass-border); padding-bottom: 15px; text-align: center; margin-top: 0;">عنوان الامتحان</h2>

            <div id="examTimerContainer" class="hidden exam-timer">
                <span data-i18n="timeLabel">⏱️ الوقت:</span> <span id="examTimerText">00:00</span>
            </div>
            
            <div id="normalNavControls" style="display: flex; justify-content: space-between; align-items: center; margin-bottom: 20px; background: var(--glass-bg); padding: 10px; border-radius: 14px; border: 1px solid var(--glass-border);">
                <button class="btn btn-secondary" onclick="prevQuestion()">🔙</button>
                <select id="questionSelect" onchange="jumpToQuestion(this.value)" style="width: auto; flex: 1; margin: 0 15px; background: transparent; border:none;"></select>
                <button class="btn btn-secondary" onclick="nextQuestionNav()">⏭️</button>
            </div>
            
            <div style="display: flex; justify-content: space-between; margin-bottom: 6px;">
                <span id="quizProgress" style="font-weight: bold; color: var(--primary-color);"></span>
            </div>
            <div class="quiz-progress-bar-wrap">
                <div class="quiz-progress-bar-fill" id="quizProgressBar" style="width: 0%;"></div>
            </div>
            
            <div id="externalAiControls" style="text-align: left; margin-bottom: 15px;">
                <button class="btn-ai chatgpt" onclick="askExternalAI('chatgpt')">🧠 ChatGPT</button>
                <button class="btn-ai gemini" onclick="askExternalAI('gemini')">✨ Gemini</button>
            </div>

            <h3 id="questionText" direction="ltr">جاري التحميل...</h3>
            
            <div id="options"></div>
            
            <div id="feedback" class="feedback"></div>
            
            <div id="controls" style="margin-top: 30px; display: none;">
                <button class="btn btn-success" id="nextBtn" onclick="nextQuestion()">التالي ⏭️</button>
                <button class="btn btn-danger" id="tryAgainBtn" onclick="tryAgain()" style="display: none;">🔄 حاول تاني</button>
            </div>
            
        </div>
    </div>

    <div id="examResultScreen" class="screen">
        <div class="quiz-container" style="text-align: center;">
            <h2 data-i18n="finalResultTitle">🎯 النتيجة النهائية</h2>
            <h1 id="finalScoreText" style="font-size: 4rem; color: var(--primary-color);">0%</h1>
            <p id="examResultMessage" style="font-size: 1.2rem; font-weight: bold; margin-bottom: 30px; line-height: 1.6;"></p>
            
            <div style="display: flex; justify-content: center; gap: 15px; flex-wrap: wrap;">
                <button class="btn btn-primary" onclick="window.location.href='lecture.html'" data-i18n="backToLecsBtn">🔙 رجوع للمحاضرة</button>
                <button class="btn btn-success hidden" id="reviewBtnMain" onclick="showReview()" data-i18n="reviewBtn">🔍 مراجعة الإجابات</button>
            </div>
            
            <div id="reviewContainer" style="display: none; margin-top: 40px; text-align: right; direction: rtl; border-top: 1px dashed var(--glass-border); padding-top: 20px;"></div>
        </div>
    </div>

    <div id="toast-container"></div>
    
    <script src="https://www.gstatic.com/firebasejs/10.8.0/firebase-app-compat.js"></script>
    <script src="https://www.gstatic.com/firebasejs/10.8.0/firebase-auth-compat.js"></script>
    <script src="https://www.gstatic.com/firebasejs/10.8.0/firebase-firestore-compat.js"></script>
    <script src="https://cdn.jsdelivr.net/npm/canvas-confetti@1.6.0/dist/confetti.browser.min.js"></script>
    
    <script src="app.js"></script>
    
    <script>
        const currentSubjectKey = localStorage.getItem('currentSubjectKey');
        const currentSubjectName = localStorage.getItem('currentSubjectName');
        const currentLectureName = localStorage.getItem('currentLectureName');
        
        const isExamMode = localStorage.getItem('isExamMode') === 'true';
        const isComprehensiveMode = localStorage.getItem('isComprehensiveMode') === 'true';
        const isMistakesMode = localStorage.getItem('isMistakesMode') === 'true';

        let currentQIndex = 0; 
        let examScore = 0; 
        let examTimeLeft = 0; 
        let examTimerInterval; 
        let questionsList = [];
        
        let audioCtx = null; 
        let isSoundEnabled = localStorage.getItem('zaker_sound') !== 'disabled';

        if (!currentSubjectKey) {
            window.location.href = 'index.html';
        }

        auth.onAuthStateChanged(async user => {
            if (user) {
                currentUser = user; 
                
                document.getElementById('userProfile').classList.remove('hidden');
                document.getElementById('userImg').src = user.photoURL; 
                document.getElementById('userName').innerText = user.displayName.split(' ')[0];
                
                try {
                    const doc = await db.collection('users').doc(currentUser.uid).get();
                    if (doc.exists) {
                        globalData = doc.data();
                        
                        if (!globalData.userProgress) globalData.userProgress = {};
                        if (!globalData.wrongQuestions) globalData.wrongQuestions = {};
                        if (!globalData.wrongQuestions[currentSubjectKey]) globalData.wrongQuestions[currentSubjectKey] = [];
                        
                        if (!globalData.userProgress[currentSubjectKey]) {
                            globalData.userProgress[currentSubjectKey] = { total: 0, correct: 0, wrong: 0 };
                        }
                        
                        if (isMistakesMode) {
                            // سحب الأسئلة الخطأ للمراجعة
                            questionsList = [...globalData.wrongQuestions[currentSubjectKey]].sort(() => 0.5 - Math.random());
                            document.getElementById('lectureTitleQuiz').innerText = currentSubjectName + ' - ' + t('mistakesTitle');
                        }
                        else if (isComprehensiveMode) {
                            generateComprehensiveQuestions();
                            document.getElementById('lectureTitleQuiz').innerText = currentSubjectName + ' - ' + t('compExamTitle');
                        } else {
                            if (globalData.allData && globalData.allData[currentSubjectKey] && globalData.allData[currentSubjectKey][currentLectureName]) {
                                questionsList = globalData.allData[currentSubjectKey][currentLectureName]; 
                                document.getElementById('lectureTitleQuiz').innerText = currentSubjectName + ' - ' + currentLectureName;
                            } else { 
                                showToast(t('noQsInLec'), 'error'); 
                                setTimeout(() => window.location.href = 'lecture.html', 1500); 
                                return;
                            }
                        }
                        
                        startQuiz();
                    }
                } catch (e) { 
                    console.error(e); 
                }
            } else { 
                window.location.href = 'index.html'; 
            }
        });

        function generateComprehensiveQuestions() {
            let allMCQ = [];
            let allTF = [];
            
            const lectures = globalData.allData[currentSubjectKey];
            
            for (let lec in lectures) {
                lectures[lec].forEach(q => {
                    q.userAnswer = null; 
                    if (q.type === 'mcq') {
                        allMCQ.push(q);
                    } else if (q.type === 'tf') {
                        allTF.push(q);
                    }
                });
            }
            
            allMCQ = allMCQ.sort(() => 0.5 - Math.random());
            allTF = allTF.sort(() => 0.5 - Math.random());
            
            const requestedCount = parseInt(localStorage.getItem('compExamCount')) || 40;
            const requestedType = localStorage.getItem('compExamType') || 'mixed';
            
            let finalQuestions = [];

            if (requestedType === 'mcq') {
                finalQuestions = allMCQ.slice(0, requestedCount);
            } else if (requestedType === 'tf') {
                finalQuestions = allTF.slice(0, requestedCount);
            } else {
                let half = Math.floor(requestedCount / 2);
                let mcqPart = allMCQ.slice(0, half);
                let tfPart = allTF.slice(0, requestedCount - mcqPart.length); 
                
                if (tfPart.length < (requestedCount - mcqPart.length)) {
                    let remaining = requestedCount - tfPart.length;
                    mcqPart = allMCQ.slice(0, remaining);
                } else if (mcqPart.length < half) {
                    let remaining = requestedCount - mcqPart.length;
                    tfPart = allTF.slice(0, remaining);
                }
                finalQuestions = [...mcqPart, ...tfPart];
            }
            
            questionsList = finalQuestions.sort(() => 0.5 - Math.random());

            if(questionsList.length === 0) {
                showToast(t('notEnoughQsType'), 'error');
                setTimeout(() => window.location.href = 'lecture.html', 1500);
            } else if (questionsList.length < requestedCount) {
                showToast(t('notEnoughQsType'), 'error');
            }
        }

        function startQuiz() {
            currentQIndex = 0; 
            examScore = 0; 
            clearInterval(examTimerInterval); 
            updateSoundBtnUI();
            
            if (isExamMode) {
                document.getElementById('normalNavControls').style.display = 'none'; 
                document.getElementById('externalAiControls').style.display = 'none';
                document.getElementById('examTimerContainer').classList.remove('hidden');
                
                examTimeLeft = questionsList.length * 60; 
                updateTimerDisplay(); 
                
                examTimerInterval = setInterval(timerTick, 1000);
            } else {
                document.getElementById('normalNavControls').style.display = 'flex'; 
                document.getElementById('externalAiControls').style.display = 'block';
                document.getElementById('examTimerContainer').classList.add('hidden');
            }
            
            loadQuestion();
        }

        function loadQuestion() {
            document.getElementById('feedback').style.display = 'none'; 
            document.getElementById('controls').style.display = 'none';
            
            const optionsDiv = document.getElementById('options'); 
            optionsDiv.style.display = 'block'; 
            optionsDiv.innerHTML = '';

            if (currentQIndex < questionsList.length) {
                
                if (!isExamMode && document.getElementById('questionSelect')) {
                    const qSelect = document.getElementById('questionSelect'); 
                    qSelect.innerHTML = '';
                    
                    questionsList.forEach((q, i) => {
                        let opt = document.createElement('option'); 
                        opt.value = i; 
                        opt.text = (currentLang === 'ar' ? `سؤال ${i + 1}` : `Q ${i + 1}`);
                        
                        if (i === currentQIndex) {
                            opt.selected = true; 
                        }
                        
                        qSelect.appendChild(opt);
                    });
                }
                
                document.getElementById('quizProgress').innerText = (currentLang === 'ar' ? `السؤال ${currentQIndex + 1} من ${questionsList.length}` : `Question ${currentQIndex + 1} of ${questionsList.length}`);
                
                // Update progress bar
                const progressBar = document.getElementById('quizProgressBar');
                if (progressBar) {
                    const pct = Math.round(((currentQIndex) / questionsList.length) * 100);
                    progressBar.style.width = pct + '%';
                }
                
                const currentQ = questionsList[currentQIndex]; 
                document.getElementById('questionText').innerText = currentQ.q;

                if (currentQ.type === "tf") {
                    optionsDiv.innerHTML += `<button class="btn btn-option" onclick="checkAnswer('صح')">${currentLang==='ar'?'صح':'True'}</button>`;
                    optionsDiv.innerHTML += `<button class="btn btn-option" onclick="checkAnswer('غلط')">${currentLang==='ar'?'غلط':'False'}</button>`;
                } else if (currentQ.type === "mcq") {
                    currentQ.options.forEach(opt => { 
                        let safeOpt = opt.replace(/'/g, "\\'").replace(/"/g, '&quot;'); 
                        optionsDiv.innerHTML += `<button class="btn btn-option" onclick="checkAnswer('${safeOpt}')">${opt}</button>`; 
                    });
                }
            } else {
                if (isExamMode) { 
                    endExam(); 
                } else {
                    const progressBar = document.getElementById('quizProgressBar');
                    if (progressBar) progressBar.style.width = '100%';
                    
                    document.getElementById('quizProgress').innerText = currentLang === 'ar' ? "تم الانتهاء 🎉" : "Finished 🎉";
                    document.getElementById('questionText').innerText = currentLang === 'ar' ? "🎉 لقد أتممت جميع الأسئلة بنجاح!" : "🎉 You have successfully completed all questions!";
                    
                    optionsDiv.style.display = 'none'; 
                    document.getElementById('normalNavControls').style.display = 'none'; 
                    document.getElementById('externalAiControls').style.display = 'none';
                }
            }
        }

        async function checkAnswer(userAnswer) {
            const currentQ = questionsList[currentQIndex]; 
            currentQ.userAnswer = userAnswer; 
            globalData.userProgress[currentSubjectKey].total++;
            
            // سحب الأخطاء المسجلة
            let wrongQs = globalData.wrongQuestions[currentSubjectKey] || [];
            let qIndexInWrong = wrongQs.findIndex(q => q.q === currentQ.q);

            if (userAnswer === currentQ.a) { 
                if (isExamMode) examScore++; 
                globalData.userProgress[currentSubjectKey].correct++; 
                playQuizSound('correct'); 
                
                // لو جاوب صح وهو كان غلطان فيه قبل كدا، نمسحه من سجل الأخطاء
                if (qIndexInWrong > -1) {
                    wrongQs.splice(qIndexInWrong, 1);
                }
            } else { 
                globalData.userProgress[currentSubjectKey].wrong++; 
                playQuizSound('wrong'); 
                
                // لو غلط ومكنش مسجل في الأخطاء، نضيفه
                if (qIndexInWrong === -1) {
                    let qToSave = { ...currentQ };
                    delete qToSave.userAnswer;
                    wrongQs.push(qToSave);
                }
            }
            
            globalData.wrongQuestions[currentSubjectKey] = wrongQs;
            db.collection('users').doc(currentUser.uid).set({ 
                userProgress: globalData.userProgress,
                wrongQuestions: globalData.wrongQuestions
            }, { merge: true });

            if (isExamMode) {
                currentQIndex++; 
                loadQuestion(); 
                return;
            }
            
            const feedbackDiv = document.getElementById('feedback'); 
            const controlsDiv = document.getElementById('controls');
            
            document.getElementById('options').style.display = 'none'; 
            feedbackDiv.style.display = 'block'; 
            controlsDiv.style.display = 'flex'; 
            controlsDiv.style.gap = '10px';

            if (userAnswer === currentQ.a) {
                feedbackDiv.className = 'feedback correct';
                feedbackDiv.innerHTML = `✅ <strong>${currentLang==='ar'?'إجابة صحيحة!':'Correct!'}</strong> <br><br> ${currentQ.explanation || ''}`;
                document.getElementById('tryAgainBtn').style.display = 'none'; 
                document.getElementById('nextBtn').style.display = 'inline-block';
                document.getElementById('nextBtn').innerText = currentLang === 'ar' ? 'التالي ⏭️' : 'Next ⏭️';
            } else {
                feedbackDiv.className = 'feedback wrong';
                feedbackDiv.innerHTML = `❌ <strong>${currentLang==='ar'?'إجابة خاطئة!':'Wrong!'}</strong> <br><br> <strong>${currentLang==='ar'?'الإجابة الصحيحة هي:':'Correct Answer:'}</strong> ${currentQ.a} <br><br> ${currentQ.explanation || ''}`;
                document.getElementById('tryAgainBtn').style.display = 'inline-block'; 
                document.getElementById('tryAgainBtn').innerText = currentLang === 'ar' ? '🔄 حاول تاني' : '🔄 Try Again';
                document.getElementById('nextBtn').style.display = 'none';
            }
        }

        function endExam() {
            clearInterval(examTimerInterval); 
            const totalQs = questionsList.length; 
            const percent = Math.round((examScore / totalQs) * 100);
            
            // Complete the progress bar
            const progressBar = document.getElementById('quizProgressBar');
            if (progressBar) progressBar.style.width = '100%';
            
            if (percent >= 90) {
                confetti({ particleCount: 150, spread: 70, origin: { y: 0.6 } });
            }
            
            const scoreEl = document.getElementById('finalScoreText');
            scoreEl.innerText = `${percent}%`;
            // Color code the score
            scoreEl.className = '';
            if (percent >= 90) scoreEl.classList.add('score-legendary');
            else if (percent >= 70) scoreEl.classList.add('score-good');
            else if (percent >= 50) scoreEl.classList.add('score-okay');
            else scoreEl.classList.add('score-fail');
            
            let message = "";
            if(currentLang === 'ar') {
                if (percent >= 90) {
                    message = "أسطورة! أداؤك ممتاز جداً 🚀"; 
                } else if (percent >= 70) {
                    message = "جيد جداً، لكن يمكنك التحسن أكثر 💪"; 
                } else if (percent >= 50) {
                    message = "نجاح بصعوبة.. تحتاج للمزيد من المراجعة 📚"; 
                } else {
                    message = "للأسف النتيجة ضعيفة.. لا تيأس وحاول مرة أخرى 🔁";
                }
            } else {
                if (percent >= 90) {
                    message = "Legendary! Excellent performance 🚀"; 
                } else if (percent >= 70) {
                    message = "Very Good, but you can improve 💪"; 
                } else if (percent >= 50) {
                    message = "Barely passed.. Needs more review 📚"; 
                } else {
                    message = "Weak result.. Don't give up and try again 🔁";
                }
            }
            
            document.getElementById('examResultMessage').innerText = message;
            document.getElementById('reviewBtnMain').classList.remove('hidden');

            document.querySelectorAll('.screen').forEach(s => s.classList.remove('active')); 
            document.getElementById('examResultScreen').classList.add('active');
        }

        function showReview() {
            const container = document.getElementById('reviewContainer');
            container.style.display = 'block';
            document.getElementById('reviewBtnMain').classList.add('hidden');
            
            container.innerHTML = `<h3 style="color: var(--primary-color); margin-bottom: 25px;" data-i18n="reviewTitle">${t('reviewTitle')}</h3>`;
            
            questionsList.forEach((q, i) => {
                const isCorrect = q.userAnswer === q.a;
                const boxColor = isCorrect ? 'rgba(7, 202, 107, 0.15)' : 'rgba(234, 33, 67, 0.15)';
                const borderColor = isCorrect ? 'var(--success-color)' : 'var(--danger-color)';
                const icon = isCorrect ? '✅' : '❌';
                
                let optsHtml = q.type === 'mcq' ? `<div style="font-size: 0.95rem; color: var(--secondary-color); margin-top: 10px; background: var(--input-bg); padding: 10px; border-radius: 8px;">${q.options.join(' <span style="color: var(--primary-color);">|</span> ')}</div>` : '';
                
                container.innerHTML += `
                <div class="glass-panel" style="background: ${boxColor}; padding: 20px; border-radius: 16px; border: 1px solid ${borderColor}; margin-bottom: 20px; text-align: ${currentLang==='ar'?'right':'left'}; direction: ${currentLang==='ar'?'rtl':'ltr'};">
                    <strong style="font-size: 1.1rem;">Q${i + 1}:</strong> <span style="font-size: 1.1rem;">${q.q}</span>
                    ${optsHtml}
                    <div style="margin-top: 15px; border-top: 1px dashed ${borderColor}; padding-top: 15px;">
                        <div style="margin-bottom: 5px;"><strong data-i18n="yourAnsLabel">${t('yourAnsLabel')}</strong> <span style="font-weight: bold; color: ${borderColor};">${q.userAnswer || '-'}</span> ${icon}</div>
                        ${!isCorrect ? `<div><strong data-i18n="correctAnsLabel">${t('correctAnsLabel')}</strong> <span style="color: var(--success-color); font-weight: bold;">${q.a}</span></div>` : ''}
                    </div>
                </div>`;
            });

            container.scrollIntoView({ behavior: 'smooth' });
        }

        function timerTick() { 
            examTimeLeft--; 
            updateTimerDisplay(); 
            if (examTimeLeft <= 0) { 
                clearInterval(examTimerInterval); 
                showToast(t('js_timeUp'), 'error'); 
                endExam(); 
            } 
        }

        function updateTimerDisplay() { 
            let m = Math.floor(examTimeLeft / 60); 
            let s = examTimeLeft % 60; 
            document.getElementById('examTimerText').innerText = `${m < 10 ? '0'+m : m}:${s < 10 ? '0'+s : s}`; 
        }

        function cancelExam() { 
            clearInterval(examTimerInterval); 
            window.location.href = 'lecture.html'; 
        }

        function nextQuestion() { 
            currentQIndex++; 
            loadQuestion(); 
        }
        
        function prevQuestion() { 
            if (currentQIndex > 0) { 
                currentQIndex--; 
                loadQuestion(); 
            } 
        }
        
        function nextQuestionNav() { 
            if (currentQIndex < questionsList.length - 1) { 
                currentQIndex++; 
                loadQuestion(); 
            } 
        }
        
        function jumpToQuestion(index) { 
            currentQIndex = parseInt(index); 
            loadQuestion(); 
        }
        
        function tryAgain() { 
            document.getElementById('feedback').style.display = 'none'; 
            document.getElementById('controls').style.display = 'none'; 
            document.getElementById('options').style.display = 'block'; 
        }

        function askExternalAI(platform) {
            const currentQ = questionsList[currentQIndex]; 
            
            if(!currentQ) {
                return;
            }
            
            const promptText = currentLang === 'ar' ? `اشرحلي إجابة السؤال ده بالتفصيل الأكاديمي:\n\nالسؤال:\n${currentQ.q}\n\nالإجابة الصحيحة:\n${currentQ.a}` : `Explain the answer to this question in academic detail:\n\nQuestion:\n${currentQ.q}\n\nCorrect Answer:\n${currentQ.a}`;
            
            navigator.clipboard.writeText(promptText).then(() => { 
                showToast(t('copySuccess')); 
                setTimeout(() => { 
                    if(platform === 'chatgpt') {
                        window.open('https://chatgpt.com/', '_blank'); 
                    }
                    if(platform === 'gemini') {
                        window.open('https://gemini.google.com/app', '_blank'); 
                    }
                }, 1200); 
            });
        }

        function updateSoundBtnUI() { 
            const btn = document.getElementById('soundToggleBtn'); 
            if(btn) { 
                btn.innerHTML = isSoundEnabled ? (currentLang === 'ar' ? '🔊 الصوت شغال' : '🔊 Sound On') : (currentLang === 'ar' ? '🔇 الصوت مكتوم' : '🔇 Sound Off'); 
            } 
        }
        
        function toggleQuizSound() { 
            isSoundEnabled = !isSoundEnabled; 
            localStorage.setItem('zaker_sound', isSoundEnabled ? 'enabled' : 'disabled'); 
            updateSoundBtnUI(); 
            showToast(isSoundEnabled ? (currentLang === 'ar' ? 'تم تشغيل الصوت 🔊' : 'Sound On 🔊') : (currentLang === 'ar' ? 'تم كتم الصوت 🔇' : 'Sound Off 🔇')); 
        }
        
        function playQuizSound(type) {
            if (!isSoundEnabled) {
                return;
            }
            
            try {
                if (!audioCtx) {
                    audioCtx = new (window.AudioContext || window.webkitAudioContext)();
                }
                if (audioCtx.state === 'suspended') {
                    audioCtx.resume();
                }
                
                const osc = audioCtx.createOscillator(); 
                const gainNode = audioCtx.createGain(); 
                osc.connect(gainNode); 
                gainNode.connect(audioCtx.destination);
                
                if (type === 'correct') { 
                    osc.type = 'sine'; 
                    osc.frequency.setValueAtTime(523.25, audioCtx.currentTime); 
                    osc.frequency.exponentialRampToValueAtTime(880, audioCtx.currentTime + 0.1); 
                    gainNode.gain.setValueAtTime(0.1, audioCtx.currentTime);

        }
